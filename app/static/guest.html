<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Late checkout — huésped</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page">
      <h1>Huésped: <span id="who"></span></h1>
      <a href="index.html">cambiar sesión</a>
    </header>
    <p id="error" class="error" hidden></p>

    <section>
      <h2>Solicitar salida tardía</h2>
      <p>
        Escribe tu solicitud. Si la hora no queda clara, el sistema te
        preguntará; el importe solo viene de la política aprobada del hotel.
      </p>
      <form id="chat" class="chat">
        <input id="text" type="text"
               placeholder="Ej.: ¿Puedo salir más tarde? / A las 14:00"
               autocomplete="off">
        <button type="submit" id="send">Enviar</button>
      </form>
      <div id="log" aria-live="polite"></div>
    </section>

    <section>
      <h2>Historial de la conversación</h2>
      <button id="refresh" type="button" class="secondary">Recargar</button>
      <ol id="history"></ol>
      <p id="state"></p>
    </section>
  </main>

  <script>
    "use strict";
    // Sesiones del kit (datos/identidades.json): token -> reserva propia.
    // El servidor lo verifica: si el stay_id no coincide con el token, 403.
    const STAYS = { "guest-a1": "STAY-A1", "guest-a2": "STAY-A2", "guest-b1": "STAY-B1" };
    const token = sessionStorage.getItem("session");
    if (!token || !STAYS[token]) location.href = "index.html";
    const headers = { "Authorization": "Bearer " + token };
    let conversationId = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function showError(msg) {
      $("error").textContent = msg;
      $("error").hidden = false;
    }
    function clearError() {
      $("error").hidden = true;
      $("error").textContent = "";
    }

    async function api(path, options) {
      const res = await fetch(path, { ...options, headers });
      let body = null;
      try { body = await res.json(); } catch (_) { /* sin cuerpo */ }
      return { status: res.status, body };
    }

    function nextEventId() {
      const n = sessionStorage.getItem("eventCounter") || 0;
      sessionStorage.setItem("eventCounter", String(n + 1));
      return "evt-" + token + "-" + (n + 1);
    }

    function addBubble(who, text, meta) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.innerHTML = esc(text) +
        (meta ? '<span class="meta">' + meta + "</span>" : "");
      $("log").appendChild(div);
      $("log").scrollTop = $("log").scrollHeight;
    }

    $("chat").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = $("text").value.trim();
      if (!text) return;
      $("send").disabled = true;
      clearError();
      addBubble("user", text);
      $("text").value = "";

      const eventId = nextEventId();
      if (!conversationId) {
        conversationId = "conv-" + token + "-" + Date.now();
      }
      try {
        const { status, body } = await api("/api/messages", {
          method: "POST",
          "Content-Type": "application/json",
          body: JSON.stringify({
            event_id: eventId,
            conversation_id: conversationId,
            stay_id: STAYS[token],
            text
          })
        });
        if (status === 200) {
          addBubble("app", body.message,
            body.status + (body.replayed ? " (repetido)" : ""));
          loadHistory();
        } else {
          const msg = body?.error?.message || ("Error HTTP " + status);
          showError(msg);
          addBubble("app", "⚠ " + msg, "error");
        }
      } catch (err) {
        showError("No se pudo contactar con el servidor: " + err);
      } finally {
        $("send").disabled = false;
      }
    });

    async function loadHistory() {
      if (!conversationId) { $("state").textContent = ""; return; }
      const { status, body } = await api("/api/conversations/" + conversationId);
      if (status !== 200) return;
      $("history").innerHTML = (body.messages || []).map((m) =>
        "<li>" + esc(m.text) +
        "<br><small>" + esc(m.status) + " — " + esc(m.message || "") +
        "</small></li>"
      ).join("");
      $("state").textContent =
        (body.messages || []).length
          ? "Estado actual: " + body.status
          : "Sin mensajes todavía.";
    }

    $("refresh").addEventListener("click", loadHistory);

    $("who").textContent = token;
    // La reserva propia la decide el servidor por el token; la vista no
    // necesita conocerla para enviar mensajes.
  </script>
</body>
</html>
